name: ci
on:
  push:
    branches: [main, v2-go]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard (embedded into the binary)
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - run: go vet ./...
      # -race needs cgo; the Linux runner has gcc, the Windows one is skipped.
      - if: runner.os == 'Linux'
        run: go test -race ./... -timeout 10m
      - if: runner.os != 'Linux'
        run: go test ./... -timeout 10m
      - run: go build ./cmd/...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wb2api
          POSTGRES_PASSWORD: wb2api
          POSTGRES_DB: wb2api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wb2api -d wb2api_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL usage store round-trip and rollup concurrency
        env:
          WB_TEST_POSTGRES_DSN: postgres://wb2api:wb2api@127.0.0.1:5432/wb2api_test?sslmode=disable
        run: go test ./internal/usagedb -run 'TestPostgres' -count=1 -v
      - name: PostgreSQL schema migration lock
        env:
          WB_TEST_POSTGRES_DSN: postgres://wb2api:wb2api@127.0.0.1:5432/wb2api_test?sslmode=disable
        run: go test ./internal/platform/pg -count=1 -v
      - name: PostgreSQL panel sessions
        env:
          WB_TEST_POSTGRES_DSN: postgres://wb2api:wb2api@127.0.0.1:5432/wb2api_test?sslmode=disable
        run: go test ./internal/store/pgsessions -run TestPostgresPanelSessionStore -count=1 -v
      - name: PostgreSQL shared active realm
        env:
          WB_TEST_POSTGRES_DSN: postgres://wb2api:wb2api@127.0.0.1:5432/wb2api_test?sslmode=disable
        run: go test ./internal/store/pgrealm -count=1 -v
      - name: PostgreSQL shared pricing policies
        env:
          WB_TEST_POSTGRES_DSN: postgres://wb2api:wb2api@127.0.0.1:5432/wb2api_test?sslmode=disable
        run: go test ./internal/store/pgpricing -count=1 -v
      - name: PostgreSQL quota windows and background leader
        env:
          WB_TEST_POSTGRES_DSN: postgres://wb2api:wb2api@127.0.0.1:5432/wb2api_test?sslmode=disable
        run: go test ./internal/store/pgquota ./internal/leader -count=1 -v
      - name: PostgreSQL shared panel jobs
        env:
          WB_TEST_POSTGRES_DSN: postgres://wb2api:wb2api@127.0.0.1:5432/wb2api_test?sslmode=disable
        run: go test ./internal/store/pgjobs -count=1 -v
